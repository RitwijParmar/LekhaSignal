[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lekhasignal"
version = "0.1.0"
description = "Revenue data reliability control plane with Snowflake deployment assets and bounded MCP investigation agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.12,<4"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
lekhasignal = "lekh_signal.api:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
